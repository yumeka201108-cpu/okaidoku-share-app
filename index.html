<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf5fb">
<title>おかいもの価格シェア｜試作版</title>
<style>
:root{--blue:#eaf5fb;--blue2:#d9edf7;--pink:#f8e3eb;--pink2:#e99ab5;--cream:#fffaf0;--ink:#425563;--muted:#84939c;--line:#e8edf0;--white:#fff;--green:#6fa88e;--shadow:0 5px 20px #7895a31a}
*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.app{max-width:520px;margin:auto;min-height:100vh;background:#f9fcfd;padding-bottom:86px;position:relative}
header{position:sticky;top:0;z-index:5;background:#f9fcf2ee;backdrop-filter:blur(12px);padding:14px 18px 12px;border-bottom:1px solid #edf1f3}
.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:19px;letter-spacing:.03em;color:#4b7185}.brand span{color:#d982a0}.region{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 11px;color:#627987;font-size:12px}
main{padding:16px 16px 20px}.hero{background:linear-gradient(135deg,#e7f4fb,#fff0f4);border-radius:23px;padding:19px 17px;margin-bottom:17px;position:relative;overflow:hidden}.hero h1{font-size:21px;line-height:1.45;margin:0 0 7px;color:#46697c}.hero p{font-size:12px;color:#718793;margin:0;max-width:75%}.mascots{position:absolute;right:8px;bottom:2px;width:40%;max-width:175px}.mascots img{display:block;width:100%;height:auto;mix-blend-mode:multiply}.search{display:flex;background:white;border:1px solid #e5edf1;border-radius:15px;padding:5px 7px 5px 13px;box-shadow:var(--shadow);gap:7px;margin-bottom:15px}.search input{border:0;outline:0;min-width:0;flex:1;font-size:14px;color:var(--ink)}.search button{background:#dceef7;color:#4e788e;border-radius:11px;padding:9px 13px;font-weight:700}
.chips{display:flex;gap:8px;overflow:auto;padding:1px 0 12px}.chip{white-space:nowrap;background:#fff;border:1px solid #e8edf0;border-radius:18px;padding:8px 13px;font-size:12px;color:#71838d}.chip.active{background:#f8e6ed;border-color:#f2d2df;color:#a75e7b}
.section{display:flex;justify-content:space-between;align-items:center;margin:19px 1px 11px}.section h2{font-size:16px;margin:0;color:#4c6675}.section button{background:none;color:#9b6d82;font-size:12px}
.card{background:#fff;border:1px solid #edf1f3;border-radius:17px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px}.product{display:flex;gap:12px;align-items:center}.photo{width:76px;height:76px;border-radius:13px;background:#f5f8f9;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;font-size:31px}.photo img{width:100%;height:100%;object-fit:cover}.pinfo{min-width:0;flex:1}.pname{font-size:14px;font-weight:750;margin-bottom:4px}.sub{font-size:11px;color:var(--muted);line-height:1.5}.price{font-size:19px;font-weight:850;color:#cf7897;margin-top:5px}.price small{font-size:11px;font-weight:500;color:#84939c}.tag{display:inline-block;border-radius:20px;background:#e8f4ee;color:#5b9277;padding:4px 8px;font-size:10px;margin-top:5px}.tag.old{background:#fff3df;color:#a77d45}
.detailtop{background:linear-gradient(140deg,#eaf5fb,#fff2f5);border-radius:20px;padding:18px;text-align:center;margin-bottom:14px}.detailtop .photo{width:112px;height:112px;margin:0 auto 10px}.detailtop h2{font-size:17px;margin:5px}.bigprice{font-size:32px;font-weight:850;color:#cc7896}.storeline{font-size:12px;color:#6f818b}
.btn{width:100%;border-radius:13px;padding:13px;background:#dceef7;color:#4c7185;font-weight:750;margin-top:8px}.btn.pink{background:#f7e4ec;color:#a65f7b}.btn.ghost{background:#fff;border:1px solid var(--line);color:#657985}
.bottom{position:fixed;z-index:8;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #e9eff2;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom))}
.nav{background:transparent;color:#93a1a8;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px}.nav .ico{font-size:20px}.nav.active{color:#c87595;font-weight:800}
.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#617887}.field input,.field select{width:100%;border:1px solid #e2e9ed;border-radius:12px;padding:12px;background:white;color:#405563;outline:none}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{background:white;border:1px solid #e7edf0;border-radius:16px;padding:17px 9px;color:#587486;font-weight:750}.choice .symbol{font-size:28px;display:block;margin-bottom:7px}.notice{font-size:11px;color:#87959d;background:#fffaf0;border-radius:12px;padding:10px;line-height:1.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.empty{text-align:center;padding:35px 15px;color:#8998a0;font-size:13px}.hidden{display:none!important}.listrow{padding:13px 2px;border-bottom:1px solid #edf1f3;display:flex;align-items:center;gap:10px}.listrow:last-child{border:0}.avatar{width:43px;height:43px;border-radius:50%;background:#f8e6ed;display:grid;place-items:center;font-size:20px}
.toast{position:fixed;z-index:20;bottom:94px;left:50%;transform:translateX(-50%);background:#435d6c;color:white;border-radius:20px;padding:10px 16px;font-size:12px;box-shadow:var(--shadow);display:none;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:#34495566;z-index:15;display:none;align-items:end;justify-content:center}.modal.show{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:22px 22px 0 0;padding:22px 18px 30px;max-height:85vh;overflow:auto}.sheet h3{margin:0 0 8px}.x{float:right;background:#f2f5f6;border-radius:50%;width:30px;height:30px}
@media(min-width:600px){body{padding:20px 0}.app{border-radius:25px;overflow:hidden;box-shadow:0 10px 50px #55708022;min-height:calc(100vh - 40px)}header{position:sticky}}
</style>
</head>

function commonFields(){return `<div class="field"><label>商品名 *</label><input id="pn" placeholder="例：洗濯用洗剤"></div><div class="field"><label>メーカー・ブランド</label><input id="brand" placeholder="例：花王"></div><div class="field"><label>サイズ・種類 *</label><input id="size" placeholder="例：詰め替え用 900g"></div><div class="field"><label>カテゴリ</label><select id="cat"><option>日用品</option><option>化粧品</option><option>洗剤</option><option>紙用品</option></select></div><div class="field"><label>価格（税込・円） *</label><input id="price" type="number" inputmode="numeric" placeholder="例：398"></div><div class="field"><label>お店の名前 *</label><input id="store" placeholder="お店を検索、または名前を入力"></div><button class="btn ghost" onclick="chooseStore()">📍 現在地から近くのお店を選ぶ</button><div class="field"><label>価格の条件</label><select id="condition"><option>通常価格</option><option>特売・セール</option><option>会員限定価格</option><option>クーポン利用時</option></select></div><div class="field"><label>確認日</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>投稿者の表示</label><select id="display"><option>ニックネーム</option><option>匿名</option></select></div><button class="btn pink" onclick="submitPost()">この価格を投稿する</button>`}

function mypage(){return `<div class="card" style="padding:18px"><div class="row"><div class="avatar">☺</div><div style="flex:1"><b>ゲストユーザー</b><div class="sub">価格を見るだけなら登録不要です</div></div><span class="tag">ゲスト</span></div><button class="btn pink" onclick="toast('会員登録機能は次の開発段階で追加します')">ログイン・新規登録</button></div><div class="card">${[['🧾','自分の投稿履歴','投稿データはこの端末内で確認できます'],['♡','お気に入り',favorites.length+'件保存中'],['✎','ニックネーム・匿名設定','投稿時に選択'],['📍','利用地域の設定',region],['🔔','お知らせ','準備中'],['⚙','アカウント・設定','準備中']].map(x=>`<div class="listrow" onclick="${x[0]==='📍'?'regionModal()':"toast('この機能は次の開発段階で追加します')"}"><div class="avatar">${x[0]}</div><div style="flex:1"><b style="font-size:13px">${x[1]}</b><div class="sub">${x[2]}</div></div>›</div>`).join("")}</div><div class="notice">試作版のため、アカウント登録やクラウド同期はまだ動作しません。</div>`}
function render(){document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));view.innerHTML=page==="home"?home():page==="search"?search():page==="detail"?detail():page==="post"?post():page==="favorites"?favoritesPage():mypage();if(document.getElementById("q"))document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch()})}
function go(p){page=p;render();window.scrollTo(0,0)}
function doSearch(){query=document.getElementById("q")?.value||"";page="search";render()}
function setCat(c){category=c;render()}
function openDetail(id){detailId=id;page="detail";render();window.scrollTo(0,0)}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render();toast(favorites.includes(id)?"お気に入りに保存しました":"お気に入りから削除しました")}
function setMode(m){postMode=m;render()}
function loadPhoto(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{selectedPhoto=r.result;render()};r.readAsDataURL(f)}
function submitPost(){let name=document.getElementById("pn")?.value.trim(),size=document.getElementById("size")?.value.trim(),price=Number(document.getElementById("price")?.value),store=document.getElementById("store")?.value.trim();if(!name||!size||!price||!store){toast("商品名・サイズ・価格・お店を入力してください");return}let p={id:Date.now(),name,size,brand:document.getElementById("brand").value,cat:document.getElementById("cat").value,price,store,area:region,time:"たった今",fresh:"new",emoji:"🛍️",tax:"税込",photo:selectedPhoto};products.unshift(p);save();selectedPhoto="";detailId=p.id;page="detail";render();toast("投稿を端末内に保存しました！")}
function chooseStore(){openModal(`<button class="x" onclick="closeModal()">×</button><h3>お店を選ぶ</h3><p class="sub">位置情報は任意です。許可しない場合はお店の名前を入力できます。</p><button class="btn" onclick="useLocation()">📍 現在地から近くのお店を探す</button><div class="field"><label>お店の名前で検索・入力</label><input id="storePick" placeholder="お店の名前"></div><button class="btn pink" onclick="applyStore()">このお店を使う</button>`)}
function useLocation(){if(!navigator.geolocation){toast("この端末では位置情報を利用できません");return}navigator.geolocation.getCurrentPosition(pos=>{closeModal();toast("位置情報を取得しました。お店の候補検索は今後追加します");},()=>toast("位置情報を取得できませんでした。名前で検索してください。"),{enableHighAccuracy:false,timeout:7000})}
function applyStore(){let v=document.getElementById("storePick").value.trim();if(v){document.getElementById("store").value=v;closeModal()}}
function openModal(s){document.getElementById("sheet").innerHTML=s;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function regionModal(){openModal(`<button class="x" onclick="closeModal()">×</button><h3>利用地域を設定</h3><p class="sub">市町村単位で価格を表示します。</p><div class="field"><label>市町村名</label><input id="regionInput" value="${region}" placeholder="例：岩国市"></div><button class="btn pink" onclick="setRegion()">この地域に設定</button>`)}
function setRegion(){let v=document.getElementById("regionInput").value.trim();if(v){region=v;document.getElementById("regionBtn").textContent="📍 "+region+" ▾";closeModal();render();toast(region+"に設定しました")}}
document.getElementById("regionBtn").onclick=regionModal;
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>go(b.dataset.page));
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
render();
</script>
</body></html>
